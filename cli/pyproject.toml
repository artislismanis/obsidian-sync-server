[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obsidian-sync-cli"
version = "0.1.0"
description = "Command-line client for Obsidian Sync Server"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.9.0",
    "httpx>=0.26.0",
    "watchfiles>=0.21.0",
    "rich>=13.7.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.2.0",
    "black>=24.0.0",
]

[project.scripts]
oss = "obsidian_sync_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_sync_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
