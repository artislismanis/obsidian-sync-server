services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: server
    volumes:
      - ../server/src:/app/src
      - sync-data:/app/data
    command: ["uvicorn", "obsidian_sync.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OSS_DEBUG=true

volumes:
  sync-data:
